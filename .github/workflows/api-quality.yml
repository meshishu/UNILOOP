name: api-quality
on:
  pull_request:
    paths: ["services/api/**", ".github/workflows/api-quality.yml"]
  push:
    branches: [main]
    paths: ["services/api/**"]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
